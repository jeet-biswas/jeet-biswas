name: Profile checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out profile
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Check generated catalog
        run: python -B scripts/render_catalog.py --check
      - name: Validate profile documents and artwork
        run: python -B scripts/check_profile.py
      - name: Run regression tests
        run: python -B -m unittest discover -s tests -v
